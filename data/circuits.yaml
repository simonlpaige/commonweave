# Solution circuits: combinations of organization types that have been used
# together to address a specific social problem.
#
# This file is the single source for:
#   - SOLUTION-CIRCUITS.md                (human-readable catalogue)
#   - assets/js/map/circuits-data.js      (goals offered on the map)
#   - data/map/circuit-coverage.json      (aggregated role coverage)
# Regenerate all three with:  python data/build_circuits.py
# Check they are current with: python data/build_circuits.py --check
#
# Rules of the file
#   1. A role rule reads published record fields only (see data/circuit_match.py).
#      A match is a research lead. It does not show that the organization
#      performs the role, has capacity, or wants to be contacted.
#   2. Every precedent needs a public source that a reviewer opened on the
#      `checked` date. Do not add a precedent from memory.
#   3. `evidence` states how much the *combination* is supported:
#        combination_documented  the listed kinds of organization have worked
#                                together on this problem, per the sources
#        components_documented   each part has evidence, but the sources do not
#                                show this exact combination working together
#        hypothesis              plausible; no precedent located yet
#   4. Circuits never name directory organizations as partners. The map lets a
#      person choose candidates per role; the coverage file holds counts only.

